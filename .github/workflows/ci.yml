name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes de unidade
        run: npm run test

      - name: Verificar migrations e RLS
        # Aplica as 7 migrations num Postgres descartável e prova que a RLS
        # isola usuários. Não precisa de Docker nem de credencial do Supabase.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 >/dev/null
          npm run db:verify

      - name: Build
        run: npm run build
        env:
          # O build não conecta no Supabase, mas os módulos leem as variáveis.
          # Valores de fachada mantêm o build independente de segredo.
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: chave-de-fachada-para-build
